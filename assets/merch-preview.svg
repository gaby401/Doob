<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
<title id="title">DOOB merch first look</title>
<desc id="desc">Four premium DOOB streetwear shirt concepts in cream, washed black, forest green and bone.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102617"/><stop offset="1" stop-color="#07140b"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3ebd9"/><stop offset="1" stop-color="#ddd1b9"/></linearGradient>
  <linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292927"/><stop offset="1" stop-color="#121311"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173d27"/><stop offset="1" stop-color="#0a2114"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .label{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#a9b8aa}.doob{font:900 29px Arial Black,Arial,sans-serif;letter-spacing:-2px}.small{font:700 9px Arial,sans-serif;letter-spacing:1.6px}.tag{font:700 9px Arial,sans-serif;letter-spacing:1.7px}.script{font:700 12px Arial,sans-serif;letter-spacing:.5px}.seam{fill:none;stroke-opacity:.20;stroke-width:1.2}
  </style>
</defs>
<rect width="640" height="800" rx="28" fill="url(#bg)"/>
<circle cx="555" cy="92" r="112" fill="#43e568" opacity=".06" filter="url(#soft)"/>
<circle cx="90" cy="720" r="130" fill="#ffd12a" opacity=".05" filter="url(#soft)"/>
<text x="32" y="43" font-family="Arial Black,Arial,sans-serif" font-size="18" font-weight="900" fill="#ffd12a">$DOOB / DROP 001</text>
<text x="608" y="43" text-anchor="end" class="label">FIRST LOOK</text>

<!-- CREAM TEE -->
<g transform="translate(28 72)" filter="url(#shadow)">
  <rect width="282" height="318" rx="22" fill="#0a1d10" stroke="#2c4933"/>
  <path d="M74 57 106 37h70l32 20 45 18-21 62-29-12v150c0 14-10 24-24 24H103c-14 0-24-10-24-24V125l-29 12-21-62z" fill="url(#cream)"/>
  <path d="M112 38c4 22 54 22 58 0" fill="none" stroke="#baa98d" stroke-width="3"/>
  <path d="M80 125v150M202 125v150" class="seam" stroke="#8e806a"/>
  <text x="107" y="104" class="doob" font-size="18" fill="#173d27">$DOOB</text>
  <path d="M160 82l7-8 7 8 8-5-4 14h-22l-4-14z" fill="none" stroke="#173d27" stroke-width="2"/>
  <text x="141" y="177" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="26" font-weight="900" fill="#173d27">MORE</text>
  <text x="141" y="204" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="26" font-weight="900" fill="#173d27">GOOD DAYS</text>
  <path d="M175 220c12-22 21-27 24-46" fill="none" stroke="#70766c" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <rect x="190" y="207" width="18" height="43" rx="7" fill="#e8dfcc" stroke="#173d27" stroke-width="2" transform="rotate(13 199 228)"/>
  <circle cx="202" cy="217" r="2" fill="#173d27"/><circle cx="204" cy="226" r="2" fill="#173d27"/>
  <text x="141" y="284" text-anchor="middle" class="tag" fill="#5c665d">CREAM / HEAVYWEIGHT</text>
</g>

<!-- BLACK TEE -->
<g transform="translate(330 72)" filter="url(#shadow)">
  <rect width="282" height="318" rx="22" fill="#0a1d10" stroke="#2c4933"/>
  <path d="M74 57 106 37h70l32 20 45 18-21 62-29-12v150c0 14-10 24-24 24H103c-14 0-24-10-24-24V125l-29 12-21-62z" fill="url(#black)"/>
  <path d="M112 38c4 22 54 22 58 0" fill="none" stroke="#454744" stroke-width="3"/>
  <text x="141" y="104" text-anchor="middle" class="doob" font-size="17" fill="#e7ddc9">$DOOB</text>
  <g transform="translate(111 124)">
    <rect x="8" y="14" width="44" height="88" rx="17" fill="#e2d7c5" stroke="#777165" stroke-width="2"/>
    <path d="M12 18c8-13 28-15 37 0" fill="#6b4930"/>
    <path d="M17 13c5-11 20-16 30-5" fill="none" stroke="#9b9b90" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="23" cy="49" rx="5" ry="7" fill="#171817"/><ellipse cx="39" cy="49" rx="5" ry="7" fill="#171817"/>
    <path d="M21 69q10 9 21 0" fill="none" stroke="#171817" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M51 8c12-13 5-21 13-31" fill="none" stroke="#b7b8ae" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
  <text x="141" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#e7ddc9">GOOD VIBES</text>
  <text x="141" y="269" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#e7ddc9">HIGHER PLANS</text>
  <text x="141" y="290" text-anchor="middle" class="tag" fill="#969b91">WASHED BLACK</text>
</g>

<!-- GREEN TEE -->
<g transform="translate(28 410)" filter="url(#shadow)">
  <rect width="282" height="342" rx="22" fill="#0a1d10" stroke="#2c4933"/>
  <path d="M74 57 106 37h70l32 20 45 18-21 62-29-12v169c0 14-10 24-24 24H103c-14 0-24-10-24-24V125l-29 12-21-62z" fill="url(#green)"/>
  <path d="M112 38c4 22 54 22 58 0" fill="none" stroke="#31543d" stroke-width="3"/>
  <path d="M160 89l7-8 7 8 8-5-4 14h-22l-4-14z" fill="none" stroke="#eadfc8" stroke-width="2"/>
  <text x="141" y="137" text-anchor="middle" class="doob" fill="#eadfc8">$DOOB</text>
  <text x="141" y="159" text-anchor="middle" class="script" fill="#eadfc8">GOOD VIBES / HIGHER PLANS</text>
  <g opacity=".22" transform="translate(160 181)">
    <rect x="-26" y="9" width="51" height="102" rx="19" fill="#d7d6c7"/>
    <ellipse cx="-10" cy="48" rx="6" ry="8" fill="#07140b"/><ellipse cx="9" cy="48" rx="6" ry="8" fill="#07140b"/>
    <path d="M-12 72q12 10 25 0" fill="none" stroke="#07140b" stroke-width="3"/>
  </g>
  <text x="141" y="312" text-anchor="middle" class="tag" fill="#9ab19f">FOREST / TONAL BACK</text>
</g>

<!-- BONE TEE -->
<g transform="translate(330 410)" filter="url(#shadow)">
  <rect width="282" height="342" rx="22" fill="#0a1d10" stroke="#2c4933"/>
  <path d="M74 57 106 37h70l32 20 45 18-21 62-29-12v169c0 14-10 24-24 24H103c-14 0-24-10-24-24V125l-29 12-21-62z" fill="#e7ddc9"/>
  <path d="M112 38c4 22 54 22 58 0" fill="none" stroke="#c6bba7" stroke-width="3"/>
  <text x="141" y="98" text-anchor="middle" class="doob" font-size="18" fill="#173d27">$DOOB</text>
  <g transform="translate(107 126)">
    <rect x="8" y="15" width="52" height="108" rx="19" fill="#f0e6d5" stroke="#173d27" stroke-width="2"/>
    <path d="M12 20c8-15 32-16 43 0" fill="#6c4931"/>
    <ellipse cx="25" cy="56" rx="6" ry="8" fill="#173d27"/><ellipse cx="44" cy="56" rx="6" ry="8" fill="#173d27"/>
    <path d="M24 79q11 10 23 0" fill="none" stroke="#173d27" stroke-width="3" stroke-linecap="round"/>
    <path d="M57 12c13-16 4-24 15-38" fill="none" stroke="#858b81" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 94l-22 22M60 94l21 22" stroke="#173d27" stroke-width="4" stroke-linecap="round"/>
    <path d="M21 123l-4 28M48 123l4 28" stroke="#173d27" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="141" y="292" text-anchor="middle" class="script" fill="#173d27">A HIGHER KIND OF MERCH</text>
  <text x="141" y="315" text-anchor="middle" class="tag" fill="#6f776f">BONE / BACK GRAPHIC</text>
</g>

<text x="320" y="782" text-anchor="middle" class="label" fill="#809181">HEAVY TEES • CLEAN DETAILS • HIGHER CULTURE</text>
</svg>